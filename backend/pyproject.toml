[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "accounts",
    "attendance",
    "config",
    "courses",
    "dashboard",
    "face",
    "students",
]
